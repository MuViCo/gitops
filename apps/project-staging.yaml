apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: muvico-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: MuViCo staging environment
  sourceRepos:
    - https://github.com/MuViCo/gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: default
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
