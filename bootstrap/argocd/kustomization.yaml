apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  - https://github.com/argoproj/argo-cd/manifests/cluster-install?ref=v3.5.0

patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-dex-server
      spec:
        replicas: 0
    target:
      kind: Deployment
      name: argocd-dex-server
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-applicationset-controller
      spec:
        replicas: 0
    target:
      kind: Deployment
      name: argocd-applicationset-controller
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-notifications-controller
      spec:
        replicas: 0
    target:
      kind: Deployment
      name: argocd-notifications-controller
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-repo-server
      spec:
        template:
          spec:
            containers:
              - name: argocd-repo-server
                livenessProbe:
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 15
                  failureThreshold: 6
                readinessProbe:
                  periodSeconds: 20
                  timeoutSeconds: 15
                  failureThreshold: 6
    target:
      kind: Deployment
      name: argocd-repo-server
