apiVersion: apps/v1
kind: Deployment
metadata:
  name: muvico-staging-dep
  labels:
    app: muvico-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: muvico-staging
  template:
    metadata:
      labels:
        app: muvico-staging
    spec:
      containers:
        - name: muvico-staging
          image: quay.io/muvico_hy/muvico:staging
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: muvico-staging-secrets
          readinessProbe:
            httpGet:
              path: /api/terms
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/terms
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
