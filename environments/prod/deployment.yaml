apiVersion: apps/v1
kind: Deployment
metadata:
  name: muvico-dep
  labels:
    app: muvico
spec:
  replicas: 1
  selector:
    matchLabels:
      app: muvico
  template:
    metadata:
      labels:
        app: muvico
    spec:
      containers:
        - name: muvico
          image: quay.io/muvico_hy/muvico:v1.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: muvico-prod-secrets
          readinessProbe:
            httpGet:
              path: /api/terms
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/terms
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
